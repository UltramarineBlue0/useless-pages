<!DOCTYPE html>
<html lang="en" translate="no" data-bs-theme="dark" class="w-100 h-100 position-relative top-0 start-0 m-0 p-0">

<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="2147483647;url=https://ultramarineblue.gitlab.io/useless-pages/">
    <link rel="canonical" href="https://ultramarineblue.gitlab.io/useless-pages/" />
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src 'self' https: data: 'unsafe-eval' 'unsafe-inline';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">
    <!--Unfortunately, crossorigin="anonymous" is required to use resource integrity check. The browser will send
    the "Origin" header to the cdn, enabling the cdn providers for some limited form of tracking-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
        integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg=" crossorigin="anonymous">

    <script defer type="module" src="./index.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.9/cdn.min.js"
        integrity="sha256-PtHu0lJIiSHfZeNj1nFd6wTX+Squ255SGZ/fc8seCtM=" crossorigin="anonymous"></script>

    <link rel="icon" href="./favicon.png" />
</head>

<body class="w-100 h-100 position-absolute top-0 start-0 m-0 p-0 z-0">
    <!--In order for the element to exactly fill out the visible area without scroll bars, explicit height, width and
    position on the root and body element is necessary. Similar fixes are applied manually on the function pages-->
    <!--It seems that all bots/crawlers will follow links in anchor elements, many bots can understand the canonical
    url given by the link element and some might even use the refresh header meta tag as a hint for redirection.
    Redirect bots/crawlers to a special page to waste their time-->
    <a class="fixed-top z-n1 link-body-emphasis h1 m-5" rel="bookmark alternate" title="Please visit our new website"
        href="https://ultramarineblue.gitlab.io/useless-pages/">New website</a>
    <main x-data="embed" class="vstack gap-0 w-100 h-100 overflow-hidden bg-dark">
        <noscript>
            <h1>Please enable javascript, then reload the page</h1>
        </noscript>

        <iframe x-bind:name="$id(rndStr)" x-bind:class="showIframe ? 'fixed-top d-none' : 'w-100 h-100 m-0 p-0'"
            x-bind:srcdoc="placeholderDoc" sandbox="" credentialless height="0" width="0"
            csp="form-action 'none'; base-uri 'none'; style-src 'unsafe-inline'; default-src 'none';"></iframe>
        <!--Modifying the src of an iframe attached to the DOM creates an entry in the history. Removing then
        recreating the iframe element doesn't change the history. Allow and sandbox attribute only apply if they are
        present before loading the iframe. It seems that alpine.js sets the attributes in the order of declaration
        on the element: Need to retest when updating alpine.js to a new version-->
        <template x-if="showIframe">
            <iframe x-ref="iframeElement" x-bind:name="$id(rndStr)" x-bind:sandbox="sandboxAttr"
                x-bind:allow="allowAttr" x-bind:src="srcAttr" class="w-100 h-100 m-0 p-0" referrerpolicy="no-referrer"
                credentialless></iframe>
        </template>

        <form x-show="showDialog" x-on:submit.prevent="loadIframe" class="mt-auto" action="about:blank" novalidate
            autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" writingsuggestions="false"
            rel="nofollow noreferrer">
            <div class="row gx-2 m-1 align-items-center">
                <div class="col-auto">
                    <select x-model="selectedActionId" x-on:change="actionSelectionChanged" class="form-select">
                        <template x-for="action in actions" :key="action.id">
                            <option x-bind:value="action.id" x-bind:selected="action.id === selectedActionId"
                                x-text="action.name"></option>
                        </template>
                    </select>
                </div>
                <div x-show="settings.allowEncryptedMedia.show" class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="allowEncryptedMedia"
                            x-model.boolean="settings.allowEncryptedMedia.value">
                        <label class="form-check-label" for="allowEncryptedMedia">Allow encrypted media</label>
                    </div>
                </div>
                <div x-show="settings.enableSameOrigin.show" class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="enableSameOrigin"
                            x-model.boolean="settings.enableSameOrigin.value">
                        <label class="form-check-label" for="enableSameOrigin">Enable same origin</label>
                    </div>
                </div>
                <div x-show="settings.initialVolume.show" class="col-auto">
                    <label x-text="'Initial Volume: ' + settings.initialVolume.value" for="initialVolume"
                        class="form-label m-0"></label>
                    <input x-model.number="settings.initialVolume.value" type="range" class="form-range" min="0"
                        max="100" step="5" id="initialVolume">
                </div>
                <div x-show="settings.initialSpeed.show" class="col-auto">
                    <label x-text="'Initial Speed: ' + settings.initialSpeed.value" for="initialSpeed"
                        class="form-label m-0"></label>
                    <input x-model.number="settings.initialSpeed.value" type="range" class="form-range" min="0.25"
                        max="2" step="0.25" id="initialSpeed">
                </div>
            </div>
            <!--For some reason margin doesn't work with input-group. Only padding can add space to the right of
            the input-->
            <div x-bind:class="'p-1 input-group input-group-' + (showTextArea ? 'sm' : 'lg')">
                <button type="submit" class="btn btn-primary">Load</button>
                <input x-show="!showTextArea" x-model="queryText" x-bind:placeholder="getPlaceholder"
                    x-on:focus="$el.select()" type="text" class="form-control">
                <textarea x-show="showTextArea" x-model="queryText" x-bind:placeholder="getPlaceholder"
                    x-on:focus="$el.select()" rows="2" class="form-control"></textarea>
            </div>
        </form>
        <div class="position-absolute bottom-0 end-0 z-3 btn-group-vertical btn-group-sm">
            <button x-show="!showDialog" x-on:click="showDialog = true" class="btn btn-outline-info fw-bold"
                type="button">&xutri;</button>
            <button x-show="showDialog" x-on:click="showDialog = false" class="btn btn-outline-info fw-bold"
                type="button">&xdtri;</button>
            <button x-on:click="toggleFullscreen" class="btn btn-outline-info fw-bold" type="button">&#x2921;</button>
        </div>
    </main>
</body>

</html>
