<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src 'self' https: data: 'unsafe-eval' 'unsafe-inline';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">

    <!--no-referrer + no crossorigin attribute prevents the browser from sending a Referer or an Origin header.
    Assuming the files themselves are not tampered, this hides the origin of the requests from the cdns-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        integrity="sha256-PI8n5gCcz9cQqQXm3PEtDuPG8qx9oFsFctPg0S5zb8g=" />

    <script defer type="module" src="./index.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
        integrity="sha256-PtHu0lJIiSHfZeNj1nFd6wTX+Squ255SGZ/fc8seCtM="></script>

    <link rel="icon" href="./favicon.png" />
</head>

<body class="w-100 h-100 position-relative top-0 start-0 m-0 p-0">
    <!--In order for the element to exactly fill out the visible area without scroll bars, explicit height, width and
    position on body and child element is necessary. The same styles are applied manually on the function pages-->
    <main x-data="embed" class="vstack gap-0 w-100 h-100 position-absolute overflow-hidden top-0 start-0 z-0">
        <noscript class="h1">Please enable javascript</noscript>

        <aside x-show="!showIframe" class="w-100 h-100 bg-black"></aside>
        <!--Modifying the src of an iframe attached to the DOM creates an entry in the history. Removing then
        recreating the iframe element doesn't change the history-->
        <template x-if="showIframe">
            <iframe x-bind:allow="allowAttr" x-bind:sandbox="sandboxAttr" x-bind:src="srcAttr"
                class="w-100 h-100 bg-black" referrerpolicy="no-referrer" credentialless></iframe>
        </template>

        <form x-show="showDialog" x-on:submit.prevent="loadIframe" class="border border-1 border-secondary mt-auto"
            action="about:blank" novalidate autocapitalize="off" autocomplete="off" rel="nofollow noreferrer">
            <div class="position-relative top-0 end-0 z-2 pt-2 pe-2">
                <button x-show="showDialog" x-on:click="showDialog = false" class="btn-close" type="button"></button>
            </div>
            <div class="row gx-2 my-2 align-items-center">
                <div class="col-11 col-lg-2">
                    <select x-model="selectedActionId" x-on:change="fillSettingWithDefaults" class="form-select">
                        <template x-for="action in actions" :key="action.id">
                            <option x-bind:value="action.id" x-text="action.name"></option>
                        </template>
                    </select>
                </div>
                <div x-show="settings.allowEncryptedMedia.show" class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="allowEncryptedMedia"
                            x-model.boolean="settings.allowEncryptedMedia.value">
                        <label class="form-check-label" for="allowEncryptedMedia">Allow encrypted media</label>
                    </div>
                </div>
                <div x-show="settings.enableSameOrigin.show" class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="enableSameOrigin"
                            x-model.boolean="settings.enableSameOrigin.value">
                        <label class="form-check-label" for="enableSameOrigin">Enable same origin</label>
                    </div>
                </div>
                <div x-show="settings.initialVolume.show" class="col-auto">
                    <label x-text="'Initial Volume: ' + settings.initialVolume.value" for="initialVolume" class="form-label"></label>
                    <input x-model.number="settings.initialVolume.value" type="range" class="form-range" min="0" max="100" step="5" id="initialVolume">
                </div>
                <div x-show="settings.initialSpeed.show" class="col-auto">
                    <label x-text="'Initial Speed: ' + settings.initialSpeed.value" for="initialSpeed" class="form-label"></label>
                    <input x-model.number="settings.initialSpeed.value" type="range" class="form-range" min="1" max="2" step="0.25" id="initialSpeed">
                </div>
            </div>
            <div
                x-bind:class="selectedActionId != 'runScript' ? 'input-group input-group-lg' : 'input-group input-group-sm'">
                <button type="submit" class="btn btn-primary">Load</button>
                <input x-show="selectedActionId != 'runScript'" x-model="queryText" x-bind:placeholder="getPlaceholder"
                    x-on:focus="$el.select()" type="text" class="form-control">
                <textarea x-show="selectedActionId == 'runScript'" x-model="queryText"
                    x-bind:placeholder="getPlaceholder" x-on:focus="$el.select()" class="form-control"></textarea>
            </div>
        </form>
        <div class="position-absolute bottom-0 end-0 z-3 pb-1 pe-1 btn-group btn-group-sm">
            <button x-show="!showDialog" x-on:click="showDialog = true" class="btn btn-outline-light fw-bold"
                type="button">&ltrif;</button>
            <button x-on:click="toggleFullscreen" class="btn btn-outline-light fw-bold" type="button">&#x2921;</button>
        </div>
    </main>
</body>

</html>
