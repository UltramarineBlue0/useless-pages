<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src 'self' https: data: 'unsafe-eval' 'unsafe-inline';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
        integrity="sha256-PI8n5gCcz9cQqQXm3PEtDuPG8qx9oFsFctPg0S5zb8g=" crossorigin="anonymous"
        referrerpolicy="no-referrer" />

    <script defer type="module" src="./index.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
        integrity="sha256-PtHu0lJIiSHfZeNj1nFd6wTX+Squ255SGZ/fc8seCtM=" crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>

    <link rel="icon" href="./favicon.png" />
</head>

<body>
    <main x-data="embed" class="overflow-hidden w-100 h-100 position-relative vstack gap-0">
        <noscript class="h1">Please enable javascript</noscript>

        <aside x-show="!showIframe" class="w-100 h-100 m-0 p-0 bg-black"></aside>
        <template x-if="showIframe">
            <iframe x-ref="iframeElement" x-bind:allow="allowAttr" x-bind:sandbox="sandboxAttr"
                class="w-100 h-100 m-0 p-0 bg-black" src="about:blank" credentialless></iframe>
        </template>

        <footer x-show="showDialog" class="border border-1 border-secondary mt-auto container-fluid">
            <div class="row g-3 align-items-center">
                <div class="col-lg-2">
                    <select x-model="queryType" class="form-select">
                        <option value="ytVideo" selected>Youtube Video</option>
                        <option value="ytPlaylist">Youtube Playlist</option>
                        <option value="ttvChannel">Twitch Channel</option>
                        <option value="ttvVod">Twitch VOD</option>
                    </select>
                </div>
                <div class="col-lg-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="allowEncryptedMedia"
                            x-model.boolean="allowEncryptedMedia">
                        <label class="form-check-label" for="allowEncryptedMedia">Allow encrypted media</label>
                    </div>
                </div>
                <div class="col-lg-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="enableScripts"
                            x-model.boolean="enableScripts">
                        <label class="form-check-label" for="enableScripts">Enable scripts</label>
                    </div>
                </div>
                <div class="col-lg-2">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="enableSameOrigin"
                            x-model.boolean="enableSameOrigin">
                        <label class="form-check-label" for="enableSameOrigin">Enable same origin</label>
                    </div>
                </div>
                <div class="col-lg-auto ms-auto justify-content-end">
                    <button x-on:click="showDialog = false" class="btn-close"></button>
                </div>
            </div>
            <div class="row g-3 align-items-center">
                <div class="col-lg-1">
                    <button x-on:click="loadIframe" class="btn btn-primary">Load</button>
                </div>
                <div class="col-lg">
                    <input x-model="queryText" type="text" class="form-control" placeholder="URL / Channel name">
                </div>
            </div>
        </footer>
        <div class="position-absolute bottom-0 end-0 btn-group-vertical btn-group-sm">
            <button x-show="!showDialog" x-on:click="showDialog = true"
                class="btn btn-outline-light fw-bold">&ltrif;</button>
            <button x-on:click="$refs.iframeElement.requestFullscreen()"
                class="btn btn-outline-light fw-bold">&#x2921;</button>
        </div>
        </div>
    </main>
</body>

</html>
