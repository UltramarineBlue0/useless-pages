<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src 'self' https: 'unsafe-inline';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">
    <style>
        html,
        body,
        div,
        iframe {
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            padding: 0;
            margin: 0;
            border: 0;
            background: black;
        }
    </style>
    <script defer src="https://embed.twitch.tv/embed/v1.js"></script>
    <script defer type="module">
        try {
            const command = JSON.parse(decodeURI(location.hash.substring(1)));
            if (command.length != 3) {
                throw "Bad command: " + location.hash;
            }

            const initObject = {
                autoplay: false,
                theme: 'dark',
                layout: 'video-with-chat',
                parent: ['localhost', 'ultramarineblue0.github.io', 'ultramarineblue.gitlab.io'],
            };

            if (command[0] == 0) {
                initObject.channel = command[1];
            } else if (command[0] == 1) {
                initObject.video = command[1];
            }

            const embed = new Twitch.Embed('player', initObject);
            const setInitialParams = () => {
                setTimeout(() => {
                    const player = embed.getPlayer();
                    player.setVolume(command[2]);
                }, 9);
            };

            embed.addEventListener(Twitch.Embed.VIDEO_READY, setInitialParams);
        } catch (error) {
            console.error(error);
        }
    </script>
</head>

<body>
    <div id="player"></div>
</body>

</html>
