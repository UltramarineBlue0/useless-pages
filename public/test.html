<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src http: https: 'unsafe-inline' 'unsafe-eval';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">
    <style>
        html,
        body,
        iframe {
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            padding: 0;
            margin: 0;
            border: 0;
            background: black;
        }
    </style>
    <script defer type="module">
        try {
            const command = JSON.parse(decodeURI(location.hash.substring(1)));
            if (command.length != 2) {
                throw "Bad command: " + location.hash;
            }

            const iframe = document.createElement('iframe');
            if (command[0] == 0) {
                iframe.src = command[1];
            } else if (command[0] == 1) {
                // the end script tag always ends an inline script, regardless where it appears
                iframe.srcdoc = `
                <head>
                <script defer type="module">${command[1]}${decodeURI('%3C/script%3E')}
                <style>html, body { background: black; color: white; }</style>
                </head>`;
            } else if (command[0] == 2) {
                iframe.srcdoc = `
                <head>
                <style>html, body { background: black; color: white; }</style>
                </head>
                <body>${command[1]}</body>`;
            }

            document.body.appendChild(iframe);
        } catch (error) {
            console.error(error);
        }
    </script>
</head>

<body></body>

</html>
