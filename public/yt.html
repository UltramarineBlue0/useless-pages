<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="content-security-policy"
        content="object-src 'none'; form-action 'none'; base-uri 'none'; default-src 'self' https: 'unsafe-inline';">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="black">
    <style>
        html,
        body,
        div,
        iframe {
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            padding: 0;
            margin: 0;
            border: 0;
            background: black;
        }
    </style>
    <script defer type="module">
        try {
            const command = JSON.parse(decodeURI(location.hash.substring(1)));
            if (command.length != 4) {
                throw "Bad command: " + location.hash;
            }

            const playerVars = {
                autoplay: 0,
                hl: 'en',
                loop: 1,
                rel: 0,
                playsinline: 1,
            };

            if (command[0] == 0) {
                playerVars.playlist = command[1];
            } else if (command[0] == 1) {
                playerVars.list = command[1];
                playerVars.listType = 'playlist';
            }

            const setInitialParams = event => {
                setTimeout(() => {
                    event.target.setVolume(command[2]);
                    event.target.setPlaybackRate(command[3]);
                }, 9);
            };

            globalThis.onYouTubeIframeAPIReady = () => {
                new YT.Player('player', {
                    playerVars: playerVars,
                    events: {
                        onReady: setInitialParams,
                    },
                });
            };
        } catch (error) {
            console.error(error);
        }
    </script>
    <script defer src="https://www.youtube.com/iframe_api"></script>
</head>

<body>
    <div id="player"></div>
</body>

</html>
